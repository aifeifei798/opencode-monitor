<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opencode live monitor</title>
    <link rel="stylesheet" href="/tailwind.css" />
    <link rel="stylesheet" href="/style.css" />
    <script>
      try {
        const tp = new URLSearchParams(location.search).get("theme");
        document.documentElement.dataset.theme = tp === "light" || tp === "dark" ? tp : localStorage.getItem("oc-monitor-theme") || "dark";
      } catch { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body class="min-h-screen bg-bg text-ink font-sans antialiased">
    <div class="mx-auto max-w-[1400px] px-4 py-4 flex flex-col gap-4">
      <header class="flex items-center gap-3 flex-wrap">
        <div class="flex items-center gap-2">
          <span id="svc-dot" class="dot dot-idle"></span>
          <h1 id="header-title" data-i18n="opencode live monitor" class="text-lg font-semibold tracking-tight">opencode live monitor</h1>
        </div>
        <div id="svc-meta" class="text-xs text-ink-dim font-mono"></div>
        <div class="ml-auto flex items-center gap-2 shrink-0">
          <button id="help-btn" class="rounded border border-line bg-panel-2 px-2 py-1 text-xs text-ink-dim hover:text-ink shrink-0 whitespace-nowrap" type="button">?</button>
          <button id="theme-toggle" class="rounded border border-line bg-panel-2 px-2 py-1 text-xs text-ink-dim hover:text-ink shrink-0 whitespace-nowrap" type="button">☀</button>
          <button id="lang-toggle" class="rounded border border-line bg-panel-2 px-2 py-1 text-xs text-ink-dim hover:text-ink shrink-0 whitespace-nowrap" type="button">文</button>
        </div>
      </header>

      <div id="banner" class="hidden rounded-md border border-blocked/40 bg-blocked/10 px-3 py-2 text-sm text-blocked"></div>
      <div id="tip" class="hidden"></div>
      <div id="help" class="hidden"></div>

      <div class="grid grid-cols-1 lg:grid-cols-[220px_minmax(0,1fr)_320px] gap-3">
        <aside class="rounded-lg border border-line bg-panel p-3">
          <div data-i18n="Sessions" class="text-[11px] uppercase tracking-wider text-ink-dim mb-2">Sessions</div>
          <div id="sessions" class="flex flex-col gap-1"></div>
        </aside>

        <main class="rounded-lg border border-line bg-panel p-3 flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <div data-i18n="Execution flow (top-down)" class="text-[11px] uppercase tracking-wider text-ink-dim">Execution flow (top-down)</div>
            <div class="ml-auto flex items-center gap-2">
              <button id="export-png-btn" class="rounded border border-line bg-panel-2 px-2 py-1 text-xs text-ink-dim hover:text-ink shrink-0 whitespace-nowrap" type="button" data-i18n="Export PNG">Export PNG</button>
              <button id="export-md-btn" class="rounded border border-line bg-panel-2 px-2 py-1 text-xs text-ink-dim hover:text-ink shrink-0 whitespace-nowrap" type="button" data-i18n="Copy as Markdown">Copy as Markdown</button>
              <button id="replay-btn" class="rounded border border-line bg-panel-2 px-2 py-1 text-xs text-ink-dim hover:text-ink shrink-0 whitespace-nowrap hidden" type="button">Replay</button>
            </div>
          </div>
          <div id="pipeline" class="overflow-auto min-h-[420px]"></div>
        </main>

        <aside class="flex flex-col gap-3">
          <div class="rounded-lg border border-line bg-panel p-3">
            <div data-i18n="Timeline" class="text-[11px] uppercase tracking-wider text-ink-dim mb-2">Timeline</div>
            <div id="timeline" class="flex flex-col gap-1 max-h-[240px] overflow-auto"></div>
          </div>
          <div class="rounded-lg border border-line bg-panel p-3">
            <div id="gpu-title" data-i18n="Strata GPU" class="text-[11px] uppercase tracking-wider text-ink-dim mb-2">Strata GPU</div>
            <div id="gpu" class="flex flex-col gap-2"></div>
          </div>
          <div class="rounded-lg border border-line bg-panel p-3">
            <div data-i18n="Waiting" class="text-[11px] uppercase tracking-wider text-ink-dim mb-2">Waiting</div>
            <div id="pending" class="flex flex-col gap-1 text-sm"></div>
          </div>
          <div class="rounded-lg border border-line bg-panel p-3">
            <div data-i18n="Event stream" class="text-[11px] uppercase tracking-wider text-ink-dim mb-2">Event stream</div>
            <input id="log-filter" class="w-full mb-2 rounded border border-line bg-panel-2 px-2 py-1 text-xs font-mono" placeholder="filter event types…" />
            <div id="log" class="flex flex-col gap-1 text-[11px] font-mono max-h-[220px] overflow-auto"></div>
          </div>
        </aside>
      </div>

      <div id="chips" class="flex items-center gap-2 flex-wrap"></div>

      <section class="rounded-lg border border-line bg-panel px-4 py-3">
        <div class="flex items-baseline gap-3">
          <span id="diag-dot" class="dot dot-idle"></span>
          <h2 id="diag-headline" class="text-base font-semibold">Waiting for data…</h2>
          <span id="diag-session" class="text-xs text-ink-dim font-mono ml-auto"></span>
        </div>
        <ul id="diag-reasons" class="mt-2 text-sm text-ink-dim space-y-1"></ul>
      </section>

      <section class="rounded-lg border border-line bg-panel px-4 py-3">
        <div data-i18n="Where the time went (approx)" class="text-[11px] uppercase tracking-wider text-ink-dim mb-2">Where the time went (approx)</div>
        <div id="time-breakdown" style="min-height:44px"></div>
      </section>

      <section class="rounded-lg border border-line bg-panel px-4 py-3">
        <div data-i18n="Diagnosis history" class="text-[11px] uppercase tracking-wider text-ink-dim mb-2">Diagnosis history</div>
        <div id="diag-history" style="min-height:44px"></div>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
